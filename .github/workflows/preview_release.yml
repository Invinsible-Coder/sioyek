
name: Preview Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"

  workflow_dispatch:

jobs:
  upload-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [build-mac, build-mac-arm, build-linux, build-windows]

    steps:
    - uses: actions/checkout@v6
    - name: download artifacts
      uses: actions/download-artifact@v8
    - name: create release and upload assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "Release ${GITHUB_SHA}" \
          --generate-notes \
          --prerelease \
          ./mac-uploads/sioyek-release-mac.zip \
          ./mac-arm-uploads/sioyek-release-mac-arm.zip \
          ./linux-uploads/sioyek-release-linux.zip \
          ./windows-uploads/sioyek-release-windows-portable.zip

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
            submodules: 'recursive'
            ref: development
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Add msvc-dev-cmd
      uses: ilammy/msvc-dev-cmd@v1
      
      
    - name: Build Sioyek
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: .\build_windows.bat portable
      
    - name: upload windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-uploads
        path: sioyek-release-windows-portable.zip
        
